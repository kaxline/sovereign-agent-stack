# Terminal backend. ssh (default) adds hermes-worker and keeps workspace mounts
# off this file's hermes service. local puts those mounts on hermes and does
# not define the worker. Paths inside the fragment stay relative to the repo.
include:
  - path: ./compose/hermes/terminal-${HERMES_TERMINAL_BACKEND:-ssh}.yml
    project_directory: .

x-n8n: &service-n8n
  image: ${N8N_IMAGE:-n8nio/n8n:1.107.4}
  # Allowlist. The root .env stays on the host for Compose interpolation and
  # is not mounted into the container.
  environment:
    - DB_TYPE=sqlite
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
    - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:?set N8N_USER_MANAGEMENT_JWT_SECRET in .env}
    - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    - LIGHTRAG_URL=http://lightrag:9621
    - NEO4J_HTTP_URL=http://neo4j:7474
    - SEARXNG_URL=http://searxng:8080
    - GPTR_URL=http://gpt-researcher:8000

# Profiles that start the shared Postgres (postgres-db, db-provision, and the
# two SQL MCP sidecars). An integration that keeps data there appends its own
# profile here, e.g. ["db", "<integration>"], so enabling it starts the
# database too. See docs/database.md.
x-db-profiles: &db-profiles ["db", "todo"]

x-sql-mcp: &service-sql-mcp
  profiles: *db-profiles
  image: ${SQL_MCP_IMAGE:-crystaldba/postgres-mcp:0.3.0}
  restart: unless-stopped
  # db only: no internet egress, unreachable from hermes-worker and the
  # other services on the default network.
  networks: [db]
  depends_on:
    db-provision:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()\""]
    interval: 15s
    timeout: 5s
    retries: 6
    start_period: 15s

x-gptr: &gptr-env
  RETRIEVER: searx
  SEARX_URL: http://searxng:8080/
  # Placeholder only. The real key stays on llm-proxy.
  OPENAI_API_KEY: local-llm
  OPENAI_BASE_URL: http://llm-proxy:4000/v1
  FAST_LLM: openai:${LLM_MODEL}
  SMART_LLM: openai:${LLM_MODEL}
  STRATEGIC_LLM: openai:${LLM_MODEL}
  EMBEDDING: openai:${EMBEDDING_MODEL}
  MAX_SCRAPER_WORKERS: ${GPTR_MAX_SCRAPER_WORKERS:-2}
  DEEP_RESEARCH_BREADTH: ${GPTR_DEEP_RESEARCH_BREADTH:-2}
  DEEP_RESEARCH_DEPTH: ${GPTR_DEEP_RESEARCH_DEPTH:-1}
  DEEP_RESEARCH_CONCURRENCY: ${GPTR_DEEP_RESEARCH_CONCURRENCY:-1}
  MAX_ITERATIONS: ${GPTR_MAX_ITERATIONS:-2}
  LOGGING_LEVEL: INFO

services:
  # ----------------------------------------------------------------------
  # llm-proxy — OpenAI-compatible front for the model keys
  # Profile: core
  # Inference is compose-internal only (:4000). The admin listener is
  # published on loopback so a later Boundary caller can push keys that
  # stay in memory. Clients use the placeholder local-llm.
  # ----------------------------------------------------------------------
  llm-proxy:
    profiles: ["core"]
    container_name: ${CONTAINER_PREFIX:-}llm-proxy
    build:
      context: ./compose/llm-proxy
    image: ${IMAGE_PREFIX:-assistant}-llm-proxy:local
    restart: unless-stopped
    environment:
      - LLM_BINDING_HOST=${LLM_BINDING_HOST:-http://host.docker.internal:1234/v1}
      - LLM_BINDING_API_KEY=${LLM_BINDING_API_KEY:-}
      - LIGHTRAG_LLM_BINDING_HOST=${LIGHTRAG_LLM_BINDING_HOST:-}
      - LIGHTRAG_LLM_BINDING_API_KEY=${LIGHTRAG_LLM_BINDING_API_KEY:-}
      - EMBEDDING_BINDING_HOST=${EMBEDDING_BINDING_HOST:-http://host.docker.internal:1234/v1}
      - EMBEDDING_BINDING_API_KEY=${EMBEDDING_BINDING_API_KEY:-}
      # Optional: read keys from files (e.g. /run/secrets/...) instead. SIGHUP
      # or POST /admin/reload re-reads them. See docs/extending.md.
      - LLM_BINDING_API_KEY_FILE=${LLM_BINDING_API_KEY_FILE:-}
      - LIGHTRAG_LLM_BINDING_API_KEY_FILE=${LIGHTRAG_LLM_BINDING_API_KEY_FILE:-}
      - EMBEDDING_BINDING_API_KEY_FILE=${EMBEDDING_BINDING_API_KEY_FILE:-}
      - LLM_PROXY_ADMIN_TOKEN=${LLM_PROXY_ADMIN_TOKEN:?set LLM_PROXY_ADMIN_TOKEN in .env}
      # Routes (chat,lightrag,embed) that answer 503 until an admin push
      # names them. For a downstream app that starts the proxy keyless.
      - LLM_PROXY_AWAIT_PUSH=${LLM_PROXY_AWAIT_PUSH:-}
      - LLM_PROXY_PORT=4000
      - LLM_PROXY_ADMIN_PORT=4001
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600}
      # Longest silent gap in a streamed body before the proxy drops it.
      # Empty means LLM_TIMEOUT.
      - LLM_STREAM_IDLE_TIMEOUT=${LLM_STREAM_IDLE_TIMEOUT:-}
      # Longest one request may take, start to finish. 0 = no limit.
      - LLM_STREAM_MAX_SECONDS=${LLM_STREAM_MAX_SECONDS:-3600}
      # max_tokens added to chat/completions requests that set no limit. 0 = off.
      - LLM_DEFAULT_MAX_TOKENS=${LLM_DEFAULT_MAX_TOKENS:-16384}
    ports:
      # Admin only. Inference stays on the compose network.
      - "127.0.0.1:${LLM_PROXY_ADMIN_PORT:-4001}:4001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ----------------------------------------------------------------------
  # LightRAG API server + Web UI (document upload, graph view, retrieval)
  # Profile: rag
  # WebUI:  http://localhost:9621/webui/
  # ----------------------------------------------------------------------
  lightrag:
    profiles: ["rag"]
    container_name: ${CONTAINER_PREFIX:-}lightrag
    # Published image, unpatched. LIGHTRAG_BASE_IMAGE is the old name, kept so
    # an existing .env still pins the same tag.
    image: ${LIGHTRAG_IMAGE:-${LIGHTRAG_BASE_IMAGE:-ghcr.io/hkuds/lightrag:v1.4.9.3}}
    ports:
      - "127.0.0.1:${PORT:-9621}:9621"
    # Allowlist of what LightRAG reads. Optional storage backends stay unset
    # so an empty string does not override the image default.
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-9621}
      - WORKSPACE=${WORKSPACE:-my-kb}
      - "WEBUI_TITLE=${WEBUI_TITLE:-My Knowledge Base}"
      - "WEBUI_DESCRIPTION=${WEBUI_DESCRIPTION:-Local GraphRAG knowledge base}"
      # Model calls go to llm-proxy. The real upstreams stay in .env for the
      # proxy. Native Ollama (no /v1) sets LIGHTRAG_LLM_CLIENT_HOST and
      # EMBEDDING_CLIENT_HOST so those bindings skip the proxy.
      - LLM_BINDING=${LIGHTRAG_LLM_BINDING:-openai}
      - LLM_MODEL=${LIGHTRAG_LLM_MODEL:-your-extraction-model}
      - LLM_BINDING_HOST=${LIGHTRAG_LLM_CLIENT_HOST:-http://llm-proxy:4000/lightrag/v1}
      - LLM_BINDING_API_KEY=local-llm
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600}
      - MAX_ASYNC=${MAX_ASYNC:-1}
      - OPENAI_LLM_MAX_TOKENS=${OPENAI_LLM_MAX_TOKENS:-9000}
      - EMBEDDING_BINDING=${EMBEDDING_BINDING:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-your-embedding-model}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-768}
      - EMBEDDING_BINDING_HOST=${EMBEDDING_CLIENT_HOST:-http://llm-proxy:4000/embed/v1}
      - EMBEDDING_BINDING_API_KEY=local-llm
      - LIGHTRAG_GRAPH_STORAGE=${LIGHTRAG_GRAPH_STORAGE:-Neo4JStorage}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY:?set LIGHTRAG_API_KEY in .env}
      - "WHITELIST_PATHS=${WHITELIST_PATHS:-/health,/api/*}"
    volumes:
      - ${ASSISTANT_DATA_ROOT:-./data}/rag_storage:/app/data/rag_storage   # graph/vector/kv persistence
      - ${ASSISTANT_DATA_ROOT:-./data}/inputs:/app/data/inputs             # drop files here to bulk-ingest
    depends_on:
      llm-proxy:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9621/health')\""]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------------------------
  # lightrag-mcp — MCP adapter for LightRAG Knowledge Base queries
  # Profile: rag
  # MCP:     http://lightrag-mcp:8000/mcp   (compose-internal only)
  # Upstream: https://github.com/shemhamforash23/lightrag-mcp
  # ----------------------------------------------------------------------
  lightrag-mcp:
    profiles: ["rag"]
    container_name: ${CONTAINER_PREFIX:-}lightrag-mcp
    build:
      context: ./compose/lightrag-mcp
    restart: unless-stopped
    environment:
      - LIGHTRAG_MCP_PORT=${LIGHTRAG_MCP_PORT:-8000}
      - LIGHTRAG_MCP_PATH=${LIGHTRAG_MCP_PATH:-/mcp}
    command:
      - --mcp-transport
      - streamable-http
      - --mcp-host
      - 0.0.0.0
      - --mcp-port
      - "${LIGHTRAG_MCP_PORT:-8000}"
      - --mcp-streamable-http-path
      - "${LIGHTRAG_MCP_PATH:-/mcp}"
      - --host
      - lightrag
      - --port
      - "9621"
      - --api-key
      - "${LIGHTRAG_API_KEY}"
    depends_on:
      lightrag:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, socket; s = socket.create_connection(('127.0.0.1', int(os.getenv('LIGHTRAG_MCP_PORT', '8000'))), 5); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ----------------------------------------------------------------------
  # Neo4j — the knowledge graph store
  # Profile: rag
  # Browser: http://localhost:7474   (login with NEO4J_USERNAME / NEO4J_PASSWORD)
  # Bolt:    bolt://neo4j:7687        (used by LightRAG inside the compose network)
  # ----------------------------------------------------------------------
  neo4j:
    profiles: ["rag"]
    container_name: ${CONTAINER_PREFIX:-}lightrag-neo4j
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_HOST_PORT:-7474}:7474"   # HTTP browser UI
      - "127.0.0.1:${NEO4J_BOLT_HOST_PORT:-7687}:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]                 # auto-installs APOC (LightRAG needs it)
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      # Conservative memory so it co-exists with a local LLM on a 16 GB M1.
      # Bump these if you have RAM to spare.
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # LightRAG waits until this passes before starting (see depends_on above).
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------------------
  # Valkey — optional Redis-compatible cache for SearXNG rate limiting
  # Activate with: docker compose --profile searxng-prod up -d
  # ----------------------------------------------------------------------
  valkey:
    container_name: ${CONTAINER_PREFIX:-}searxng-valkey
    profiles: ["searxng-prod"]
    image: docker.io/valkey/valkey:7-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey_data:/data

  # ----------------------------------------------------------------------
  # SearXNG — local meta-search API (n8n HTTP, OpenCode via mcp-searxng)
  # Profile: core
  # UI/API:  http://localhost:8080   (localhost-bound; JSON API enabled)
  # ----------------------------------------------------------------------
  searxng:
    profiles: ["core"]
    container_name: ${CONTAINER_PREFIX:-}searxng
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:2026.8.11-e8e710e42}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-8080}/
    volumes:
      # settings.local.yml is written by setup.sh (gitignored). Run make ensure-local
      # or ./scripts/setup.sh before the first up if the file is missing.
      - ./searxng/settings.local.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ----------------------------------------------------------------------
  # mcp-searxng — MCP adapter for OpenCode / Hermes web search
  # Profile: core
  # MCP:     http://mcp-searxng:3000/mcp   (compose-internal only)
  # ----------------------------------------------------------------------
  mcp-searxng:
    profiles: ["core"]
    container_name: ${CONTAINER_PREFIX:-}mcp-searxng
    image: ${MCP_SEARXNG_IMAGE:-isokoliuk/mcp-searxng:1.15.0}
    restart: unless-stopped
    environment:
      - SEARXNG_URL=http://searxng:8080
      - MCP_HTTP_PORT=3000
      # Image default is 127.0.0.1 (breaking change from v1.2.1); other
      # compose services (Hermes, OpenCode) need the Docker network interface.
      - MCP_HTTP_HOST=0.0.0.0
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ----------------------------------------------------------------------
  # caldav-mcp — CalDAV bridge for Hermes (multi-account via X-Caldav headers)
  # Profile: calendar
  # MCP:     http://caldav-mcp:8080/mcp   (compose-internal only)
  # Upstream: https://github.com/gelse/caldav-mcp
  # Accounts: compose/caldav-mcp/accounts/<slug>.env (registered by bootstrap)
  # ----------------------------------------------------------------------
  caldav-mcp:
    profiles: ["calendar"]
    container_name: ${CONTAINER_PREFIX:-}caldav-mcp
    image: ${CALDAV_MCP_IMAGE:-ghcr.io/gelse/caldav-mcp:v0.1.0}
    restart: unless-stopped
    environment:
      - CALDAV_MCP_PORT=8080
      - CALDAV_MCP_PATH=/mcp
      - TZ=${TZ:-UTC}
    # No CALDAV_URL/USERNAME/PASSWORD — credentials come per-request from
    # Hermes mcp_servers headers (one account file → one MCP registration).
    # No host ports — compose-internal only.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8080),5); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ----------------------------------------------------------------------
  # mail-mcp — read-only MCP over the host-built mail index (docs/email.md)
  # Profile: mail
  # MCP:     http://mail-mcp:8000/mcp   (compose-internal only)
  # Mounts only the index folder, read-only. Never the Mail store itself.
  # ----------------------------------------------------------------------
  mail-mcp:
    profiles: ["mail"]
    container_name: ${CONTAINER_PREFIX:-}mail-mcp
    build:
      context: ./compose/mail-mcp
    image: ${IMAGE_PREFIX:-assistant}-mail-mcp:local
    restart: unless-stopped
    # Same uid as the host user that owns the 0700 index folder.
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      - MAIL_INDEX_PATH=/data/mail/${MAIL_INDEX_FILE:-index.sqlite}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    volumes:
      - ${MAIL_INDEX_DIR:-./data/mail}:/data/mail:ro
    # No host ports — compose-internal only.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ----------------------------------------------------------------------
  # mail-drafts-mcp — queues email drafts for the host helper (docs/email.md)
  # Profile: mail-drafts
  # MCP:     http://mail-drafts-mcp:8000/mcp   (compose-internal only)
  # Mounts only the drafts folder. No mail index, no Mail store, no send.
  # scripts/mail-drafts.py on the host saves each request to Mail's Drafts.
  # ----------------------------------------------------------------------
  mail-drafts-mcp:
    profiles: ["mail-drafts"]
    container_name: ${CONTAINER_PREFIX:-}mail-drafts-mcp
    build:
      context: ./compose/mail-drafts-mcp
    image: ${IMAGE_PREFIX:-assistant}-mail-drafts-mcp:local
    restart: unless-stopped
    # Same uid as the host user that owns the 0700 drafts folder.
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      - MAIL_DRAFTS_PATH=/data/mail-drafts
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    volumes:
      - ${MAIL_DRAFTS_DIR:-./data/mail-drafts}:/data/mail-drafts
    # No host ports — compose-internal only.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ----------------------------------------------------------------------
  # vikunja — todo lists with a built-in MCP server
  # Profile: todo (also starts the shared Postgres via x-db-profiles)
  # Web UI:  http://localhost:3456/login-local   (via vikunja-proxy below)
  # MCP:     http://vikunja:3456/api/v2/mcp   (Streamable HTTP, bearer token)
  # Data:    schema `vikunja` in the shared Postgres (role svc_vikunja,
  #          compose/postgres/services/vikunja.env); attachments in
  #          VIKUNJA_FILES_DIR (default ./data/vikunja/files).
  # Tokens:  make todo-init creates the account and both MCP tokens. See docs/todo.md
  # Upstream: https://github.com/go-vikunja/vikunja (AGPL-3.0)
  # ----------------------------------------------------------------------
  vikunja:
    profiles: ["todo"]
    container_name: ${CONTAINER_PREFIX:-}vikunja
    image: ${VIKUNJA_IMAGE:-vikunja/vikunja:2.7.0}
    restart: unless-stopped
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    # No host port: vikunja-proxy publishes the web UI.
    # Allowlist. VIKUNJA_DATABASE_PASSWORD comes from the env_file below, which
    # make todo-init / setup --todo write next to DB_SERVICE_PASSWORD.
    # Empty VIKUNJA_SECRET makes Vikunja pick a random one per start, which
    # logs everyone out on restart; setup.sh generates it for every install.
    environment:
      - VIKUNJA_SERVICE_PUBLICURL=${VIKUNJA_PUBLIC_URL:-http://localhost:${VIKUNJA_PORT:-3456}/}
      - VIKUNJA_SERVICE_SECRET=${VIKUNJA_SECRET:-}
      # make todo-init creates the account from the CLI, so the sign-up form
      # stays off unless asked for.
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=${VIKUNJA_ENABLE_REGISTRATION:-false}
      # "Stay logged in" lifetime. /login-local asks for a long session, so a
      # browser signed in once stays signed in. Default 10 years.
      - VIKUNJA_SERVICE_JWTTTLLONG=${VIKUNJA_SESSION_TTL:-315360000}
      - VIKUNJA_SERVICE_TIMEZONE=${TZ:-UTC}
      - VIKUNJA_DATABASE_TYPE=postgres
      - VIKUNJA_DATABASE_HOST=postgres-db
      - VIKUNJA_DATABASE_USER=svc_vikunja
      - VIKUNJA_DATABASE_DATABASE=${DB_NAME:-assistant}
      # Pins search_path; the role owns this schema and can create nothing else.
      - VIKUNJA_DATABASE_SCHEMA=vikunja
      - VIKUNJA_DATABASE_SSLMODE=disable
    env_file:
      # Compose parses this service with the profile off, so the file may be absent.
      - path: ./compose/postgres/services/vikunja.env
        required: false
    volumes:
      - ${VIKUNJA_FILES_DIR:-./data/vikunja/files}:/app/vikunja/files
    # default: vikunja-proxy and hermes. db: its schema in the shared Postgres.
    networks: [default, db]
    depends_on:
      db-provision:
        condition: service_completed_successfully
    healthcheck:
      # The image has no shell; the binary ships its own probe.
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s

  # Loopback front for vikunja. Passes everything through and serves
  # /login-local, which signs the browser in with the account make todo-init
  # manages (VIKUNJA_USERNAME / VIKUNJA_PASSWORD), so there is no password to
  # keep. Anyone who can reach 127.0.0.1:3456 gets in. compose/vikunja-proxy/
  vikunja-proxy:
    profiles: ["todo"]
    container_name: ${CONTAINER_PREFIX:-}vikunja-proxy
    image: ${VIKUNJA_PROXY_IMAGE:-nginx:1.29.1-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VIKUNJA_PORT:-3456}:8080"
    environment:
      - VIKUNJA_USERNAME=${VIKUNJA_USERNAME:-}
      - VIKUNJA_PASSWORD=${VIKUNJA_PASSWORD:-}
      # Render only these into the template; nginx's own $variables stay.
      - NGINX_ENVSUBST_FILTER=^VIKUNJA_
      # One worker per allowed CPU (the cpus cap below), not one per host core.
      - NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE=1
    # One user on loopback: half a CPU and one worker are plenty (~3 MiB RAM).
    cpus: 0.5
    volumes:
      - ./compose/vikunja-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./compose/vikunja-proxy/login-local.html:/usr/share/nginx/html/login-local.html:ro
    depends_on:
      vikunja:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/info || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ----------------------------------------------------------------------
  # GPT Researcher — deep web research API (n8n/Hermes REST)
  # Profile: automation
  # API:     http://localhost:8000/report/   (localhost-bound)
  # Uses SearXNG for retrieval; LLM via llm-proxy (OPENAI_BASE_URL)
  # ----------------------------------------------------------------------
  gpt-researcher:
    profiles: ["automation"]
    container_name: ${CONTAINER_PREFIX:-}gpt-researcher
    image: ${GPTR_IMAGE:-gptresearcher/gpt-researcher:0.8.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GPTR_PORT:-8000}:8000"
    environment:
      <<: *gptr-env
      DOC_PATH: /usr/src/app/my-docs
    volumes:
      - gptr_outputs:/usr/src/app/outputs
      - ${ASSISTANT_DATA_ROOT:-./data}/inputs:/usr/src/app/my-docs:ro
    depends_on:
      llm-proxy:
        condition: service_healthy
      searxng:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ----------------------------------------------------------------------
  # gptr-mcp — MCP adapter for OpenCode/Hermes deep research
  # Profile: automation
  # MCP:     http://gptr-mcp:8000/sse   (compose-internal only)
  # Vendored from https://github.com/assafelovic/gptr-mcp
  # ----------------------------------------------------------------------
  gptr-mcp:
    profiles: ["automation"]
    container_name: ${CONTAINER_PREFIX:-}gptr-mcp
    build:
      context: ./compose/gptr-mcp
    restart: unless-stopped
    environment:
      <<: *gptr-env
      MCP_TRANSPORT: sse
      DOCKER_CONTAINER: "true"
    depends_on:
      llm-proxy:
        condition: service_healthy
      searxng:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 40s

  # ----------------------------------------------------------------------
  # postgres — deprecated. n8n never read it: n8n has always stored its data
  # in SQLite on n8n_storage. No profile starts it. It stays defined so
  # downstream overlays that override it still parse, and so the old
  # postgres_storage data can be inspected with --profile n8n-postgres-legacy.
  # Will be removed in a later release. docs/n8n.md#upgrading-from-v031
  # ----------------------------------------------------------------------
  postgres:
    profiles: ["n8n-postgres-legacy"]
    container_name: ${CONTAINER_PREFIX:-}n8n-postgres
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------
  # postgres-db — shared Postgres for integrations and the agent
  # Profile: db (plus any integration profile added to x-db-profiles)
  # One database (DB_NAME, default assistant), one schema per owner:
  #   agent      agent_rw writes, agent_ro reads
  #   <slug>     svc_<slug> writes (compose/postgres/services/<slug>.env)
  # Not n8n's database: n8n uses SQLite on n8n_storage.
  # No host port. Data: DB_DATA_DIR (default ./data/db). docs/database.md
  # ----------------------------------------------------------------------
  postgres-db:
    profiles: *db-profiles
    container_name: ${CONTAINER_PREFIX:-}postgres-db
    image: ${DB_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    # Empty DB_ADMIN_PASSWORD makes the image refuse to initialise, which is
    # the intended failure. No ${VAR:?} here: compose interpolates this
    # service even when the db profile is off.
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD:-}
      - POSTGRES_DB=${DB_NAME:-assistant}
    volumes:
      # Postgres 18 images keep PGDATA in a versioned subdirectory
      # (18/docker), so a later major upgrade can sit beside it.
      - ${DB_DATA_DIR:-./data/db}:/var/lib/postgresql
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${DB_NAME:-assistant}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot role/schema reconciliation; re-runs on every up. See
  # compose/postgres/provision.sh.
  db-provision:
    profiles: *db-profiles
    container_name: ${CONTAINER_PREFIX:-}db-provision
    image: ${DB_IMAGE:-postgres:18-alpine}
    restart: "no"
    environment:
      - PGHOST=postgres-db
      - PGUSER=postgres
      - PGPASSWORD=${DB_ADMIN_PASSWORD:-}
      - PGDATABASE=${DB_NAME:-assistant}
      - DB_AGENT_RO_PASSWORD=${DB_AGENT_RO_PASSWORD:-}
      - DB_AGENT_RW_PASSWORD=${DB_AGENT_RW_PASSWORD:-}
    volumes:
      - ./compose/postgres/provision.sh:/provision.sh:ro
      - ./compose/postgres/services:/services:ro
    networks: [db]
    entrypoint: ["/bin/sh", "/provision.sh"]
    depends_on:
      postgres-db:
        condition: service_healthy

  # ----------------------------------------------------------------------
  # sql-mcp-ro / sql-mcp-rw — SQL MCP for Hermes (postgres-mcp)
  # Profile: db
  # MCP:     http://sql-mcp-ro:8000/sse  (agent_ro, restricted mode)
  #          http://sql-mcp-rw:8000/sse  (agent_rw, unrestricted mode)
  # db network only. Hermes registers ro on api-server, rw on default and
  # browser (SQL_MCP_ENABLED=1). Upstream: https://github.com/crystaldba/postgres-mcp
  # ----------------------------------------------------------------------
  sql-mcp-ro:
    <<: *service-sql-mcp
    container_name: ${CONTAINER_PREFIX:-}sql-mcp-ro
    environment:
      # Generated passwords are hex, so they need no URL escaping.
      - DATABASE_URI=postgresql://agent_ro:${DB_AGENT_RO_PASSWORD:-}@postgres-db:5432/${DB_NAME:-assistant}
    # restricted = read-only transaction, COMMIT/ROLLBACK rejected, time limit.
    # A second guard; agent_ro's grants already deny every write.
    command: ["--access-mode=restricted", "--transport=sse", "--sse-host=0.0.0.0", "--sse-port=8000"]

  sql-mcp-rw:
    <<: *service-sql-mcp
    container_name: ${CONTAINER_PREFIX:-}sql-mcp-rw
    environment:
      - DATABASE_URI=postgresql://agent_rw:${DB_AGENT_RW_PASSWORD:-}@postgres-db:5432/${DB_NAME:-assistant}
    # Writes are bounded by agent_rw's grants: CREATE/DML in schema agent only.
    command: ["--access-mode=unrestricted", "--transport=sse", "--sse-host=0.0.0.0", "--sse-port=8000"]

  # ----------------------------------------------------------------------
  # n8n-import — one-shot seed of demo credentials + workflows (starter-kit pattern)
  # Profile: automation
  # Seeds only when n8n's SQLite database does not exist yet, so it never
  # opens a database a running n8n holds. It must mount the same
  # /home/node/.n8n as n8n; an overlay that rebinds one must rebind both.
  # ----------------------------------------------------------------------
  n8n-import:
    <<: *service-n8n
    profiles: ["automation"]
    container_name: ${CONTAINER_PREFIX:-}n8n-import
    entrypoint: /bin/sh
    command: /scripts/import-demo-data.sh
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/demo-data:/demo-data
      - ./n8n/import-demo-data.sh:/scripts/import-demo-data.sh:ro

  # ----------------------------------------------------------------------
  # n8n — workflow automation UI
  # Profile: automation (typically pair with rag + core for full demos)
  # UI:  http://localhost:5678
  # ----------------------------------------------------------------------
  n8n:
    <<: *service-n8n
    profiles: ["automation"]
    container_name: ${CONTAINER_PREFIX:-}n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    # This list replaces the anchor environment, so the store, the secrets
    # and the workflow URL are repeated here. The anchor still feeds n8n-import.
    environment:
      - DB_TYPE=sqlite
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_HOST_PORT:-5678}/
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/shared
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:?set N8N_USER_MANAGEMENT_JWT_SECRET in .env}
      - N8N_DEFAULT_BINARY_DATA_MODE=${N8N_DEFAULT_BINARY_DATA_MODE:-filesystem}
      - GPTR_URL=${GPTR_URL:-http://gpt-researcher:8000}
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/demo-data:/demo-data
      - ${ASSISTANT_DATA_ROOT:-./data}/inputs:/data/shared:ro
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
        required: false
      lightrag:
        condition: service_healthy
        required: false
      searxng:
        condition: service_healthy
        required: false
      gpt-researcher:
        condition: service_healthy
        required: false

  # ----------------------------------------------------------------------
  # opencode-mcp — MCP bridge so Hermes can delegate coding to OpenCode
  # Profile: coding
  # MCP:     http://opencode-mcp:8000/sse   (compose-internal only)
  # ----------------------------------------------------------------------
  opencode-mcp:
    profiles: ["coding"]
    container_name: ${CONTAINER_PREFIX:-}opencode-mcp
    build:
      context: ./compose/opencode-mcp
    image: ${IMAGE_PREFIX:-assistant}-opencode-mcp:local
    environment:
      - OPENCODE_BASE_URL=${OPENCODE_BASE_URL:-http://opencode:4096}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
      - OPENCODE_WORKSPACE_HOST=${OPENCODE_WORKSPACE_HOST:?set OPENCODE_WORKSPACE_HOST in .env}
      - CODING_EXTRA_ROOTS=${CODING_EXTRA_ROOTS:-}
      # Set to 1 when an embedding app grants roots itself (needs_access hint
      # says the app will ask instead of naming make coding-root-add).
      - CODING_ROOTS_APP_MANAGED=${CODING_ROOTS_APP_MANAGED:-}
      # Hermes path=host path pairs, ;-separated. coding_start_task accepts
      # either side. See docs/opencode.md#path-aliases.
      - CODING_PATH_ALIASES=${CODING_PATH_ALIASES:-}
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - TASK_DEFAULT_TIMEOUT_SEC=${OPENCODE_MCP_TASK_TIMEOUT:-600}
    volumes:
      # Host coding root so completion checks can read greet.py after edits.
      - ${OPENCODE_WORKSPACE_HOST}:${OPENCODE_WORKSPACE_HOST}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      opencode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------------
  # OpenCode — AI coding agent (web UI + OpenAPI server)
  # Profile: coding
  # UI/API:  http://localhost:4096   (HTTP basic auth from .env)
  # Docs:    http://localhost:4096/doc
  # Code:    OPENCODE_WORKSPACE_HOST, mounted at the same path in the container
  # Secrets: shadow per-project .env files via docker-compose.override.yml
  # ----------------------------------------------------------------------
  opencode:
    profiles: ["coding"]
    container_name: ${CONTAINER_PREFIX:-}opencode
    # Local image adds git. Upstream ships none, which breaks worktree detection
    # and collapses every directory into the single `global` project.
    build:
      context: ./compose/opencode
    image: ${IMAGE_PREFIX:-assistant}-opencode:local
    command: ["web", "--hostname", "0.0.0.0", "--port", "4096"]
    ports:
      - "127.0.0.1:${OPENCODE_PORT:-4096}:4096"
    environment:
      - OPENCODE_CONFIG=/etc/opencode/opencode.json
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
    # Mounted at its own host path so paths in the UI match paths in your terminal.
    working_dir: ${OPENCODE_WORKSPACE_HOST}
    volumes:
      - opencode_config:/root/.config/opencode
      - opencode_data:/root/.local/share/opencode
      - ${OPENCODE_WORKSPACE_HOST}:${OPENCODE_WORKSPACE_HOST}
      # opencode.local.json is written by setup (gitignored). Run make ensure-local first.
      - ./opencode/opencode.local.json:/etc/opencode/opencode.json:ro
    depends_on:
      llm-proxy:
        condition: service_healthy
      mcp-searxng:
        condition: service_healthy
        required: false
      gptr-mcp:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header \"Authorization: Basic $$(echo -n \"$$OPENCODE_SERVER_USERNAME:$$OPENCODE_SERVER_PASSWORD\" | base64)\" http://127.0.0.1:4096/global/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------------
  # Ollama — optional in-compose LLM for zero-config demos (CPU)
  # Profile: ollama
  # On Apple Silicon, Docker cannot use the GPU; prefer a host model server
  # for performance, or this profile for a self-contained demo path.
  # Point LLM_BINDING_HOST at http://ollama:11434 when using this profile.
  # ----------------------------------------------------------------------
  ollama:
    profiles: ["ollama"]
    container_name: ${CONTAINER_PREFIX:-}ollama
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.11.11}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # One-shot model pull for the demo chat + embed pair. Re-run with:
  #   docker compose --profile ollama run --rm ollama-pull
  ollama-pull:
    profiles: ["ollama"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.11.11}
    container_name: ${CONTAINER_PREFIX:-}ollama-pull
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen2.5:7b-instruct}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling $$OLLAMA_CHAT_MODEL ..."
        ollama pull "$$OLLAMA_CHAT_MODEL"
        echo "Pulling $$OLLAMA_EMBED_MODEL ..."
        ollama pull "$$OLLAMA_EMBED_MODEL"
        echo "Ollama models ready."
    depends_on:
      ollama:
        condition: service_healthy

  # ----------------------------------------------------------------------
  # signal-cli — native HTTP JSON-RPC daemon for Hermes Signal messaging
  # Profile: signal (toggled by HERMES_SIGNAL_ENABLED via scripts/sync-signal-profile.sh)
  #
  # Hermes expects the real signal-cli daemon (--http), not
  # bbernhard/signal-cli-rest-api. Bind-mount the host linked store
  # (SIGNAL_CLI_DATA_DIR, usually ~/.local/share/signal-cli). Stop any host
  # signal-cli daemon first — only one receiver per account.
  # Port 8080 is compose-internal only (SearXNG already owns host :8080).
  # ----------------------------------------------------------------------
  signal-cli:
    profiles: ["signal"]
    container_name: ${CONTAINER_PREFIX:-}signal-cli
    image: ${SIGNAL_CLI_IMAGE:-registry.gitlab.com/packaging/signal-cli/signal-cli-jre:v0-14-7-2}
    restart: unless-stopped
    # Match the Mac/Linux user that owns SIGNAL_CLI_DATA_DIR.
    # scripts/sync-signal-profile.sh sets these from `id -u` / `id -g` when enabling.
    user: "${SIGNAL_CLI_UID:-1000}:${SIGNAL_CLI_GID:-1000}"
    environment:
      - SIGNAL_ACCOUNT=${SIGNAL_ACCOUNT:-}
    # packaging image ENTRYPOINT is signal-cli; --config points at the mount.
    # SIGNAL_ACCOUNT / SIGNAL_CLI_DATA_DIR are required when the profile is on
    # (enforced by scripts/sync-signal-profile.sh), not via ${VAR:?} here —
    # compose still parses this service when the profile is off.
    command:
      - --config
      - /var/lib/signal-cli
      - -a
      - ${SIGNAL_ACCOUNT:-}
      - daemon
      - --http
      - 0.0.0.0:8080
    volumes:
      - ${SIGNAL_CLI_DATA_DIR:-./data/signal-cli-placeholder}:/var/lib/signal-cli
    tmpfs:
      - /tmp:exec
    # No host publish — Hermes reaches http://signal-cli:8080 on the compose network.
    healthcheck:
      # Image may lack curl; /dev/tcp is enough to prove the HTTP daemon is up.
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 40s

  # ----------------------------------------------------------------------
  # Hermes Agent — persistent AI gateway + dashboard
  # Profile: core (default stack)
  # Setup:   docker compose run --rm hermes setup   (after first ./scripts/setup.sh)
  # Gateway: http://localhost:8642 (default profile; dashboard)
  # API:     http://localhost:8643/v1 (api-server profile; see compose/hermes/)
  # Dashboard: http://localhost:9119 (localhost-bound)
  # Voice:   ASSISTANT_DATA_ROOT/voice/<name>/samples/ — see docs/writing-voice.md
  # Projects: ASSISTANT_DATA_ROOT/projects/<name>/ — see docs/projects.md
  # Memory:  ASSISTANT_DATA_ROOT/memory/ — see docs/memory.md
  #          MEMORY.md / USER.md are shared across profiles via memories/ overlays
  # Data root: make data-dir-show / docs/data-dir.md (Hermes state stays in ./data/hermes)
  # ----------------------------------------------------------------------
  hermes-api-bootstrap:
    profiles: ["core"]
    image: nousresearch/hermes-agent:${HERMES_AGENT_IMAGE_TAG:-v0.22.2}
    restart: "no"
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - TZ=${TZ:-UTC}
      - HERMES_TERMINAL_BACKEND=${HERMES_TERMINAL_BACKEND:-ssh}
      - HERMES_API_PROFILE_NAME=${HERMES_API_PROFILE_NAME:-api-server}
      - HERMES_API_MAX_TURNS=${HERMES_API_MAX_TURNS:-20}
      - HERMES_API_SERVER_PORT=${HERMES_API_SERVER_PORT:-8643}
      # Unattended one-shots must not distill themselves into USER.md.
      - HERMES_MEMORY_NUDGE_INTERVAL=${HERMES_API_MEMORY_NUDGE_INTERVAL:-10}
      # Web-reading MCP sidecar registered on both Hermes profiles.
      - SEARXNG_MCP_URL=${SEARXNG_MCP_URL:-http://mcp-searxng:3000/mcp}
      - LIGHTRAG_MCP_URL=${LIGHTRAG_MCP_URL:-http://lightrag-mcp:8000/mcp}
      - LIGHTRAG_MCP_ENABLED=${LIGHTRAG_MCP_ENABLED:-0}
      # CalDAV MCP (calendar profile); accounts mounted below.
      - CALDAV_MCP_URL=${CALDAV_MCP_URL:-http://caldav-mcp:8080/mcp}
      - CALDAV_MCP_ENABLED=${CALDAV_MCP_ENABLED:-0}
      - CALDAV_MCP_TIMEOUT=${CALDAV_MCP_TIMEOUT:-60}
      - CALDAV_MCP_CONNECT_TIMEOUT=${CALDAV_MCP_CONNECT_TIMEOUT:-30}
      - CALDAV_MCP_ACCOUNTS_DIR=/bootstrap/caldav-accounts
      # OpenCode coding MCP (coding profile); registered on default + browser only.
      - OPENCODE_MCP_URL=${OPENCODE_MCP_URL:-http://opencode-mcp:8000/sse}
      - OPENCODE_MCP_ENABLED=${OPENCODE_MCP_ENABLED:-0}
      - OPENCODE_MCP_TIMEOUT=${OPENCODE_MCP_TIMEOUT:-600}
      - OPENCODE_MCP_CONNECT_TIMEOUT=${OPENCODE_MCP_CONNECT_TIMEOUT:-30}
      # SQL MCP (db profile): ro on api-server, rw on default + browser.
      - SQL_MCP_ENABLED=${SQL_MCP_ENABLED:-0}
      - SQL_MCP_RO_URL=${SQL_MCP_RO_URL:-http://sql-mcp-ro:8000/sse}
      - SQL_MCP_RW_URL=${SQL_MCP_RW_URL:-http://sql-mcp-rw:8000/sse}
      - SQL_MCP_TIMEOUT=${SQL_MCP_TIMEOUT:-60}
      - SQL_MCP_CONNECT_TIMEOUT=${SQL_MCP_CONNECT_TIMEOUT:-30}
      # Vikunja MCP (todo profile): read-only token here, read/write on default + browser.
      - VIKUNJA_MCP_ENABLED=${VIKUNJA_MCP_ENABLED:-0}
      - VIKUNJA_MCP_URL=${VIKUNJA_MCP_URL:-http://vikunja:3456/api/v2/mcp}
      - VIKUNJA_MCP_TIMEOUT=${VIKUNJA_MCP_TIMEOUT:-60}
      - VIKUNJA_MCP_CONNECT_TIMEOUT=${VIKUNJA_MCP_CONNECT_TIMEOUT:-30}
      - VIKUNJA_MCP_TOKEN_RO=${VIKUNJA_MCP_TOKEN_RO:-}
      - VIKUNJA_MCP_TOKEN_RW=${VIKUNJA_MCP_TOKEN_RW:-}
      # Mail MCP (mail profile): default + browser only, never api-server.
      - MAIL_MCP_ENABLED=${MAIL_MCP_ENABLED:-0}
      - MAIL_MCP_URL=${MAIL_MCP_URL:-http://mail-mcp:8000/mcp}
      - MAIL_MCP_TIMEOUT=${MAIL_MCP_TIMEOUT:-60}
      - MAIL_MCP_CONNECT_TIMEOUT=${MAIL_MCP_CONNECT_TIMEOUT:-30}
      # Mail drafts MCP (mail-drafts profile): default + browser only, never api-server.
      - MAIL_DRAFTS_ENABLED=${MAIL_DRAFTS_ENABLED:-0}
      - MAIL_DRAFTS_MCP_URL=${MAIL_DRAFTS_MCP_URL:-http://mail-drafts-mcp:8000/mcp}
      - MAIL_DRAFTS_MCP_TIMEOUT=${MAIL_DRAFTS_MCP_TIMEOUT:-60}
      - MAIL_DRAFTS_MCP_CONNECT_TIMEOUT=${MAIL_DRAFTS_MCP_CONNECT_TIMEOUT:-30}
      # Upstream URL only (no key), to size the stale-stream timeout.
      - LLM_BINDING_HOST=${LLM_BINDING_HOST:-http://host.docker.internal:1234/v1}
      - HERMES_PROXY_STALE_TIMEOUT=${HERMES_PROXY_STALE_TIMEOUT:-}
      - HERMES_MAX_TOKENS=${HERMES_MAX_TOKENS:-16384}
    volumes:
      - ./data/hermes:/opt/data
      - ./compose/hermes/api-server.env:/bootstrap/api-server.env:ro
      - ./compose/hermes/bootstrap-api-profile.sh:/bootstrap/bootstrap-api-profile.sh:ro
      - ./compose/caldav-mcp/accounts:/bootstrap/caldav-accounts:ro
    entrypoint: /bin/sh
    command: /bootstrap/bootstrap-api-profile.sh

  # Second gateway profile, for interactive browser chat via hermes-webui.
  # Same script as hermes-api-bootstrap with a different name, port, turn cap,
  # and toolset; its default-profile side effects are idempotent.
  #
  # Port 8644 stays unpublished on purpose. hermes-webui reaches it in-network
  # at http://hermes:8644.
  hermes-browser-bootstrap:
    profiles: ["core"]
    image: nousresearch/hermes-agent:${HERMES_AGENT_IMAGE_TAG:-v0.22.2}
    restart: "no"
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - TZ=${TZ:-UTC}
      - HERMES_TERMINAL_BACKEND=${HERMES_TERMINAL_BACKEND:-ssh}
      - HERMES_API_PROFILE_NAME=${HERMES_BROWSER_PROFILE_NAME:-browser}
      # Interactive chat: a human is watching and can interrupt, and the tight
      # unattended cap would only truncate useful work mid-task.
      - HERMES_API_MAX_TURNS=${HERMES_BROWSER_MAX_TURNS:-60}
      - HERMES_API_SERVER_PORT=${HERMES_BROWSER_API_PORT:-8644}
      # Interactive chat: background memory review every N user turns. Default 10
      # keeps a single local LM Studio slot free for foreground chat; the old
      # value of 3 fired on turn 3/6 and often raced the user's next message.
      - HERMES_MEMORY_NUDGE_INTERVAL=${HERMES_BROWSER_MEMORY_NUDGE_INTERVAL:-10}
      # Full CLI toolset: interactive-only tools (clarify, send_message,
      # text_to_speech) are wanted here, unlike the unattended API profile.
      - HERMES_API_TOOLSET=hermes-cli
      - BOOTSTRAP_API_ENV=/bootstrap/browser.env
      - SEARXNG_MCP_URL=${SEARXNG_MCP_URL:-http://mcp-searxng:3000/mcp}
      - LIGHTRAG_MCP_URL=${LIGHTRAG_MCP_URL:-http://lightrag-mcp:8000/mcp}
      - LIGHTRAG_MCP_ENABLED=${LIGHTRAG_MCP_ENABLED:-0}
      - CALDAV_MCP_URL=${CALDAV_MCP_URL:-http://caldav-mcp:8080/mcp}
      - CALDAV_MCP_ENABLED=${CALDAV_MCP_ENABLED:-0}
      - CALDAV_MCP_TIMEOUT=${CALDAV_MCP_TIMEOUT:-60}
      - CALDAV_MCP_CONNECT_TIMEOUT=${CALDAV_MCP_CONNECT_TIMEOUT:-30}
      - CALDAV_MCP_ACCOUNTS_DIR=/bootstrap/caldav-accounts
      - OPENCODE_MCP_URL=${OPENCODE_MCP_URL:-http://opencode-mcp:8000/sse}
      - OPENCODE_MCP_ENABLED=${OPENCODE_MCP_ENABLED:-0}
      - OPENCODE_MCP_TIMEOUT=${OPENCODE_MCP_TIMEOUT:-600}
      - OPENCODE_MCP_CONNECT_TIMEOUT=${OPENCODE_MCP_CONNECT_TIMEOUT:-30}
      # SQL MCP (db profile): ro on api-server, rw on default + browser.
      - SQL_MCP_ENABLED=${SQL_MCP_ENABLED:-0}
      - SQL_MCP_RO_URL=${SQL_MCP_RO_URL:-http://sql-mcp-ro:8000/sse}
      - SQL_MCP_RW_URL=${SQL_MCP_RW_URL:-http://sql-mcp-rw:8000/sse}
      - SQL_MCP_TIMEOUT=${SQL_MCP_TIMEOUT:-60}
      - SQL_MCP_CONNECT_TIMEOUT=${SQL_MCP_CONNECT_TIMEOUT:-30}
      - VIKUNJA_MCP_ENABLED=${VIKUNJA_MCP_ENABLED:-0}
      - VIKUNJA_MCP_URL=${VIKUNJA_MCP_URL:-http://vikunja:3456/api/v2/mcp}
      - VIKUNJA_MCP_TIMEOUT=${VIKUNJA_MCP_TIMEOUT:-60}
      - VIKUNJA_MCP_CONNECT_TIMEOUT=${VIKUNJA_MCP_CONNECT_TIMEOUT:-30}
      - VIKUNJA_MCP_TOKEN_RO=${VIKUNJA_MCP_TOKEN_RO:-}
      - VIKUNJA_MCP_TOKEN_RW=${VIKUNJA_MCP_TOKEN_RW:-}
      # Mail MCP (mail profile): default + browser only, never api-server.
      - MAIL_MCP_ENABLED=${MAIL_MCP_ENABLED:-0}
      - MAIL_MCP_URL=${MAIL_MCP_URL:-http://mail-mcp:8000/mcp}
      - MAIL_MCP_TIMEOUT=${MAIL_MCP_TIMEOUT:-60}
      - MAIL_MCP_CONNECT_TIMEOUT=${MAIL_MCP_CONNECT_TIMEOUT:-30}
      # Mail drafts MCP (mail-drafts profile): default + browser only, never api-server.
      - MAIL_DRAFTS_ENABLED=${MAIL_DRAFTS_ENABLED:-0}
      - MAIL_DRAFTS_MCP_URL=${MAIL_DRAFTS_MCP_URL:-http://mail-drafts-mcp:8000/mcp}
      - MAIL_DRAFTS_MCP_TIMEOUT=${MAIL_DRAFTS_MCP_TIMEOUT:-60}
      - MAIL_DRAFTS_MCP_CONNECT_TIMEOUT=${MAIL_DRAFTS_MCP_CONNECT_TIMEOUT:-30}
      # Upstream URL only (no key), to size the stale-stream timeout and
      # decide whether auto-title may compete with the reply.
      - LLM_BINDING_HOST=${LLM_BINDING_HOST:-http://host.docker.internal:1234/v1}
      - HERMES_PROXY_STALE_TIMEOUT=${HERMES_PROXY_STALE_TIMEOUT:-}
      - HERMES_MAX_TOKENS=${HERMES_MAX_TOKENS:-16384}
      - HERMES_BROWSER_AUTO_TITLE=${HERMES_BROWSER_AUTO_TITLE:-auto}
    volumes:
      - ./data/hermes:/opt/data
      - ./compose/hermes/browser.env:/bootstrap/browser.env:ro
      - ./compose/hermes/bootstrap-api-profile.sh:/bootstrap/bootstrap-api-profile.sh:ro
      - ./compose/caldav-mcp/accounts:/bootstrap/caldav-accounts:ro
    depends_on:
      hermes-api-bootstrap:
        condition: service_completed_successfully
    entrypoint: /bin/sh
    command: /bootstrap/bootstrap-api-profile.sh

  # hermes-worker, its depends_on, and the workspace mounts are in
  # compose/hermes/terminal-ssh.yml or terminal-local.yml.

  hermes:
    profiles: ["core"]
    container_name: ${CONTAINER_PREFIX:-}hermes
    image: nousresearch/hermes-agent:${HERMES_AGENT_IMAGE_TAG:-v0.22.2}
    restart: unless-stopped
    command: ["gateway", "run"]
    ports:
      - "127.0.0.1:${HERMES_GATEWAY_PORT:-8642}:8642"
      - "127.0.0.1:${HERMES_API_SERVER_PORT:-8643}:8643"
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9119"
    # Allowlist. Do not mount the root .env: this process can run a shell.
    # Dashboard auth stays because the dashboard shares the container.
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - TZ=${TZ:-UTC}
      # Buzz localhost proxy (cont-init). Private keys stay in profile .env files.
      - HERMES_BUZZ_ENABLED=${HERMES_BUZZ_ENABLED:-0}
      - BUZZ_RELAY_URL=${BUZZ_RELAY_URL:-}
      # Bound every Hermes LLM call (foreground + bg-review). Local endpoints
      # skip implicit stale detection unless the stale timeout is explicit.
      - HERMES_API_TIMEOUT=${HERMES_API_TIMEOUT:-180}
      - HERMES_API_CALL_STALE_TIMEOUT=${HERMES_API_CALL_STALE_TIMEOUT:-90}
      # One reconnect per stream, not two. llm-proxy is the next hop, so a
      # failed stream is an upstream failure, and each retry waits out the
      # full read timeout again.
      - HERMES_STREAM_RETRIES=${HERMES_STREAM_RETRIES:-1}
      # Gateway turn.heartbeat interval while a turn runs (0 = off).
      - HERMES_TURN_HEARTBEAT_S=${HERMES_TURN_HEARTBEAT_S:-30}
      # Opt-outs for compose/hermes/019-pin-profile-gateways.sh: 0 stops pinning
      # gateway.standalone / sessions.auto_prune where those keys are unset.
      - HERMES_PIN_STANDALONE_GATEWAYS=${HERMES_PIN_STANDALONE_GATEWAYS:-1}
      - HERMES_PIN_SESSIONS_KEEP=${HERMES_PIN_SESSIONS_KEEP:-1}
      - HERMES_DASHBOARD=1
      # The dashboard always binds 0.0.0.0 inside the container (host ports are
      # localhost-only), and since agent 0.20.0 a non-loopback bind engages an
      # auth gate that HERMES_DASHBOARD_INSECURE no longer opens. With no
      # registered provider the dashboard refuses to bind at all and the
      # healthcheck below never passes. Basic auth is the lightest provider.
      # BASIC_AUTH_SECRET keeps dashboard sessions valid across restarts.
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:?set HERMES_DASHBOARD_PASSWORD in .env}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_AUTH_SECRET:?set HERMES_DASHBOARD_AUTH_SECRET in .env}
      # API server runs on the api-server profile (port 8643), not the default gateway.
      - API_SERVER_ENABLED=false
      # browser-harness (browser_exec) control sockets. The default is under
      # $HOME, i.e. data/hermes (virtiofs). A socket there that outlives a
      # Docker VM restart (Docker Desktop quit/crash, Mac reboot) fails with
      # EOPNOTSUPP on connect and unlink, and the session stays broken until
      # it is removed on the host. /tmp is the container filesystem. SHARED
      # keeps the bu-<session> names so default and named sessions do not
      # collide.
      # Logs and screenshots (BH_TMP_DIR) are plain files and stay put.
      - BH_RUNTIME_DIR=/tmp/browser-harness
      - BH_RUNTIME_DIR_SHARED=1
      # Same problem for the gateway control socket that Hermes v0.22 gateways
      # use to find each other: bind it on /tmp instead of data/hermes. See
      # compose/hermes/patch-control-socket-tmp.py.
      - HERMES_CONTROL_SOCKET_IN_TMP=1
      # One uv cache for every profile (uvx browser-use), on a native volume:
      # under each profile's HOME it sat on virtiofs and a warm run took ~57 s.
      - UV_CACHE_DIR=/opt/uv-cache
      # .env sets SEARXNG_URL for n8n/GPTR. Hermes must NOT inherit it: native
      # web_search auto-binds to SearXNG and still executes when the model
      # hallucinates the tool after we disable the web toolset. MCP uses
      # SEARXNG_MCP_URL instead.
      - SEARXNG_URL=
      # The official image sets HERMES_WRITE_SAFE_ROOT=/opt/data. write_file and
      # patch then hard-block every other path, even when the shell is on the
      # SSH worker. Keep the worker paths listed so remote writes are allowed.
      # Do not add /opt/skills (read-only) or the SSH private key.
      # Coding roots: primary OPENCODE_WORKSPACE_HOST plus optional CODING_EXTRA_ROOTS
      # (colon-prefixed, e.g. :/Users/you/other-repo) from make coding-root-add.
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/opt/projects:/opt/voice:/opt/memory:${OPENCODE_WORKSPACE_HOST}${CODING_EXTRA_ROOTS:-}
      # The environment probe reports /opt/data as both home and cwd, and hands
      # the agent no other path. Left at that, it builds every path for the
      # user's own files under /opt/data (e.g. /opt/data/projects) and reports
      # the mounts below as missing. Covers both gateways in this container, so
      # there is no need to repeat it per profile.
      # The context-root sentence switches on CONTEXT_ROOTS_APP_MANAGED. Compose
      # has no if/else: ${V:+x} renders only when V is set, and ${V:-y} renders
      # y when V is unset but V's own value when set. The set branch therefore
      # wraps that value: "(CONTEXT_ROOTS_APP_MANAGED=1)".
      - "HERMES_ENVIRONMENT_HINT=Mount layout: /opt/data holds Hermes' own config
        and state, not the user's work. The user's material lives on separate mounts
        that no path under /opt/data can reach: /opt/projects (per-project working
        directories, read-write), /opt/voice (writing-voice corpora, read-write),
        /opt/memory (curated long-form notes, read-write), and /opt/skills
        (repo-shipped skills, read-only). A projects-library slug that is an
        immediate child of /opt/projects maps to /opt/projects/<slug> (for
        example /opt/projects/career). If the name is not an immediate child,
        do not invent /opt/projects/<name> — call coding_list_roots and use
        the host absolute path. Locate / look in X / diagnose an error in a
        named repo is a coding-root read, not a notes-project read. If
        search_files returns Path not found plus similar paths, use those
        paths or clarify once; do not retry the same missing path. Do not
        grep /opt/hermes, /opt/data, or container runtime unless the user is
        debugging Hermes. Pass these absolute paths to the file, search, and
        terminal tools; never resolve them relative to the working directory.
        Coding roots (host absolute paths, shared with the coding agent): primary
        ${OPENCODE_WORKSPACE_HOST}, plus any extras from CODING_EXTRA_ROOTS.${CODING_PATH_ALIASES:+
        Project folders that are also host folders (Hermes path=host path):
        ${CODING_PATH_ALIASES}. For coding work in such a project, pass either
        path to coding_start_task; prefer this mapping over matching folder
        names against coding_list_roots.}
        HARD RULE: for implement/refactor/fix/test work in a git repo under a
        coding root, your FIRST mutating action must be the MCP tool
        coding_start_task (names may be prefixed mcp__opencode__coding_*).
        Do NOT use write_file, patch, or terminal to edit source or drive a
        local fix loop under a coding root — that bypasses the coding agent.
        After coding_start_task, only coding_wait_for_task /
        coding_get_task_status / coding_get_task_result / coding_continue_task.
        If coding_start_task returns needs_access, follow the hint in that
        result exactly.
        Context roots (host absolute paths, read-only notes — not coding
        targets and not writable): ${CONTEXT_EXTRA_ROOTS:-none}. Open INDEX.md
        paths exactly as written. Do not prefix /opt/projects onto absolute
        host paths. If a listed extra-root path is missing, ${CONTEXT_ROOTS_APP_MANAGED:+the
        app will ask the user to grant access to it (CONTEXT_ROOTS_APP_MANAGED=}${CONTEXT_ROOTS_APP_MANAGED:-ask
        the user to run: make context-root-add DIR=<absolute-path>
        then recreate the container that mounts that path (hermes-worker when
        the terminal backend is ssh, hermes when it is local) after they
        confirm.}${CONTEXT_ROOTS_APP_MANAGED:+). Tell the user in one sentence
        which folder you need and why, then stop and wait; don't suggest
        commands.}
        Active knowledge base (LightRAG WORKSPACE): ${WORKSPACE}. Host inputs for
        that corpus live under ASSISTANT_DATA_ROOT/inputs/${WORKSPACE}/ (the
        inputs mount). For knowledge questions stay on LightRAG before web
        search: query_document for what the corpus says or a content summary;
        get_documents or get_pipeline_status for what is indexed, empty, or
        ingest state; check_lightrag_health only if a LightRAG call failed. If
        the KB has nothing relevant, say so rather than inventing, then search
        only if the user wants broader context. For past conversations use session_search.
        Web lookup routing (avoids emptying SearXNG via parallel upstream bans):
        the native web_search/web_extract toolset is disabled on this stack — use
        MCP searxng_web_search for one quick fact (at most one call unless the
        user asks for deep research; do not fan out several query variants in
        parallel). Hallucinated native web_* calls are rewritten to MCP when
        possible. For a known URL use web_url_read (no search fan-out). If search
        returns hits but a page fetch fails (403 / bot detection), quote from the
        search snippets — do not report that SearXNG is empty. Prefer the local
        browser tools when a real page body is required and web_url_read is
        blocked. Deep multi-step reports need the automation compose profile
        (gptr); if gptr tools are not listed, stay on searxng_web_search +
        web_url_read / browser. Avoid deep_research while LightRAG is indexing.
        After a web search or URL read, answer in a few sentences. Do not emit
        fetch scripts, urllib, or 'let me call tool X' as prose — call the tool
        or stop.
        Short durable facts belong in the memory tool (USER.md / MEMORY.md);
        longer notes belong under /opt/memory.
        Living todos (cross-session task list) live in the todo app when its
        tools (tasks_list, tasks_create, mcp__todos__*) are available — use
        those, and call it the user's todo list; otherwise they live at
        /opt/projects/project-todo-list/README.md — read and edit that file.
        Either way, do not use the session-only todo tool for the user's todo
        list.
        Container local time (TZ) is authoritative for today and Conversation
        started; do not convert from UTC unless asked."
    volumes:
      - ./data/hermes:/opt/data
      # Share MEMORY.md / USER.md across default, api-server, and browser.
      # Without these overlays each profile writes into its own empty memories/
      # and WebUI facts never reach the dashboard (or the other way around).
      - ./data/hermes/memories:/opt/data/profiles/api-server/memories
      - ./data/hermes/memories:/opt/data/profiles/browser/memories
      # Repo-shipped skills. Read-only, because Hermes draws no write boundary
      # around external skill dirs; the ro flag is what keeps skill_manage out.
      # The worker has the same tree so a remote read_file of a skill works.
      # Workspace mounts (projects, voice, memory, coding root) and the SSH
      # worker key are added by the terminal backend fragment.
      - ./compose/hermes/skills:/opt/skills:ro
      # Relax intent-ack detection for browser/WebUI (LM Studio narration stalls).
      - ./compose/hermes/patch-intent-ack-continuation.py:/bootstrap/patch-intent-ack-continuation.py:ro
      - ./compose/hermes/03-patch-intent-ack.sh:/etc/cont-init.d/03-patch-intent-ack:ro
      # WebUI Signal send with browser adapter disabled (default owns SSE lock).
      # Consolidated overlays: one writer per Hermes target where practical.
      - ./compose/hermes/patch-send-message-tool.py:/bootstrap/patch-send-message-tool.py:ro
      - ./compose/hermes/patch-ensure-send-message-tools.py:/bootstrap/patch-ensure-send-message-tools.py:ro
      - ./compose/hermes/patch-tool-search-visible.py:/bootstrap/patch-tool-search-visible.py:ro
      - ./compose/hermes/patch-tool-search-always-include.py:/bootstrap/patch-tool-search-always-include.py:ro
      - ./compose/hermes/patch-cron-scheduler-delivery.py:/bootstrap/patch-cron-scheduler-delivery.py:ro
      - ./compose/hermes/04-patch-signal-send.sh:/etc/cont-init.d/04-patch-signal-send:ro
      # Weak-model text tool-call recovery.
      # Compatibility overlays — Hermes upstream closed content promotion (#29115).
      - ./compose/hermes/text_tool_call_recovery.py:/bootstrap/text_tool_call_recovery.py:ro
      - ./compose/hermes/patch-text-tool-call-recovery.py:/bootstrap/patch-text-tool-call-recovery.py:ro
      - ./compose/hermes/fabricated_result.py:/bootstrap/fabricated_result.py:ro
      - ./compose/hermes/patch-fabricated-result.py:/bootstrap/patch-fabricated-result.py:ro
      - ./compose/hermes/patch-block-native-web-tools.py:/bootstrap/patch-block-native-web-tools.py:ro
      - ./compose/hermes/patch-tool-call-flat-args.py:/bootstrap/patch-tool-call-flat-args.py:ro
      - ./compose/hermes/tool_eval_trace.py:/bootstrap/tool_eval_trace.py:ro
      - ./compose/hermes/patch-tool-eval-trace.py:/bootstrap/patch-tool-eval-trace.py:ro
      - ./compose/hermes/patch-browser-exec-hint.py:/bootstrap/patch-browser-exec-hint.py:ro
      - ./compose/hermes/browser_exec_hints.py:/bootstrap/browser_exec_hints.py:ro
      - ./compose/hermes/history_budget.py:/bootstrap/history_budget.py:ro
      - ./compose/hermes/history_budget_hook.py:/bootstrap/history_budget_hook.py:ro
      - ./compose/hermes/patch-history-budget.py:/bootstrap/patch-history-budget.py:ro
      - ./compose/hermes/client_context.py:/bootstrap/client_context.py:ro
      - ./compose/hermes/patch-client-context.py:/bootstrap/patch-client-context.py:ro
      - ./compose/hermes/gateway_liveness.py:/bootstrap/gateway_liveness.py:ro
      - ./compose/hermes/patch-gateway-liveness.py:/bootstrap/patch-gateway-liveness.py:ro
      - ./compose/hermes/patch-control-socket-tmp.py:/bootstrap/patch-control-socket-tmp.py:ro
      - ./compose/hermes/05-patch-tool-calling.sh:/etc/cont-init.d/05-patch-tool-calling:ro
      - ./compose/hermes/08-warmup-agent-browser.sh:/etc/cont-init.d/08-warmup-agent-browser:ro
      # FS library: immediate /opt/projects children → projects.list / projects.tree.
      - ./compose/hermes/scripts/projects_library.py:/bootstrap/projects_library.py:ro
      - ./compose/hermes/patch-projects-library.py:/bootstrap/patch-projects-library.py:ro
      - ./compose/hermes/07-patch-projects-library.sh:/etc/cont-init.d/07-patch-projects-library:ro
      # Buzz: keep ws://localhost:3000 community host, proxy to host relay.
      - ./compose/hermes/buzz-localhost-proxy.py:/bootstrap/buzz-localhost-proxy.py:ro
      - ./compose/hermes/06-buzz-localhost-proxy.sh:/etc/cont-init.d/06-buzz-localhost-proxy:ro
      # Wake parked MCP servers (POST /v1/mcp/servers/{name}/reconnect) and
      # mcp_servers.<name>.parked_retry_interval. See docs/extending.md.
      - ./compose/hermes/mcp_wake.py:/bootstrap/mcp_wake.py:ro
      - ./compose/hermes/patch-mcp-wake.py:/bootstrap/patch-mcp-wake.py:ro
      - ./compose/hermes/10-patch-mcp-wake.sh:/etc/cont-init.d/10-patch-mcp-wake:ro
      # Shared uv cache (UV_CACHE_DIR above). HERMES_UV_CACHE_DIR may name a
      # host path instead; keep it off virtiofs if speed matters.
      - ${HERMES_UV_CACHE_DIR:-hermes_uv_cache}:/opt/uv-cache
      - ./compose/hermes/11-warmup-uv-cache.sh:/etc/cont-init.d/11-warmup-uv-cache:ro
      # Per-profile gateways and kept sessions on Hermes v0.22+. Runs before the
      # image's 02-reconcile-profiles. See the script header.
      - ./compose/hermes/019-pin-profile-gateways.sh:/etc/cont-init.d/019-pin-profile-gateways:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1g"
    deploy:
      resources:
        limits:
          # Three supervised gateways now live here (default, api-server, and
          # browser for the WebUI). Each runs as its own Python process with its
          # own loaded toolset and MCP clients, and 2G left the third no room.
          # Hermes v0.22 would fold them into one; 019-pin-profile-gateways
          # keeps them apart.
          memory: 3G
    depends_on:
      hermes-api-bootstrap:
        condition: service_completed_successfully
      # cont-init.d/02-reconcile-profiles reads each profile's gateway_state.json
      # once at container start, so the browser profile has to exist before
      # hermes boots or its gateway stays down until the next restart.
      hermes-browser-bootstrap:
        condition: service_completed_successfully
      llm-proxy:
        condition: service_healthy
      # Optional: only present when the `rag` profile is enabled.
      lightrag-mcp:
        condition: service_healthy
        required: false
      mcp-searxng:
        condition: service_healthy
        required: false
      # Optional: only present when the `calendar` profile is enabled.
      caldav-mcp:
        condition: service_healthy
        required: false
      # Optional: only present when the `coding` profile is enabled.
      opencode-mcp:
        condition: service_healthy
        required: false
      # Optional: only present when the `signal` profile is enabled.
      signal-cli:
        condition: service_healthy
        required: false
      # Optional: only present when the `db` profile is enabled.
      sql-mcp-ro:
        condition: service_healthy
        required: false
      sql-mcp-rw:
        condition: service_healthy
        required: false
      # Optional: only present when the `todo` profile is enabled.
      vikunja:
        condition: service_healthy
        required: false
    # db is internal and holds only the shared Postgres and its SQL MCP
    # sidecars. hermes is the one default-network service that joins it, so
    # hermes-worker (the agent's shell) cannot reach either.
    networks: [default, db]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9119/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 40s

  # ----------------------------------------------------------------------
  # Hermes WebUI — a conventional chat UI for Hermes (localhost:8787).
  # Profile: core. See docs/hermes-webui.md
  #
  # Runs "lean": this container holds no agent runtime. Every turn is forwarded
  # to the browser gateway in the `hermes` container, so tools, MCP sidecars,
  # skills, and the /opt/projects mounts all execute where they already work.
  # The startup log therefore carries an expected
  # "!! WARNING: hermes-agent source not found." Full parity would mean mounting
  # the agent source, which costs a multi-minute editable install on every start
  # plus a second copy of the agent's dependency tree to keep in sync.
  # ----------------------------------------------------------------------
  hermes-webui:
    profiles: ["core"]
    container_name: ${CONTAINER_PREFIX:-}hermes-webui
    image: ghcr.io/nesquena/hermes-webui:${HERMES_WEBUI_IMAGE_TAG:-0.52.458}
    restart: unless-stopped
    # Stock init rsyncs /apptoo → /app then starts server.py. Our wrapper
    # patches load_workspaces on the runtime tree first so /opt/projects
    # children show up as workspaces.
    # See compose/hermes/scripts/patch-webui-projects-library.py.
    entrypoint: ["/bin/bash", "/bootstrap/hermeswebui-entrypoint.sh"]
    ports:
      - "127.0.0.1:${HERMES_WEBUI_PORT:-8787}:8787"
    # Supplies API_SERVER_KEY (gateway credential) plus
    # HERMES_WEBUI_GATEWAY_API_KEY (same value). WebUI prefers the latter, which
    # survives _reload_dotenv overwriting API_SERVER_KEY from HERMES_HOME/.env.
    # Pointedly NOT `.env`, which would leak unrelated provider keys into a
    # container that never makes a model call.
    env_file:
      - ./compose/hermes/browser.env
    environment:
      - HERMES_HOME=/opt/data
      - HERMES_WEBUI_STATE_DIR=/opt/data/webui
      # Bind all interfaces inside the container; the host port above is
      # loopback-only, same as every other service here.
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_DEFAULT_WORKSPACE=/opt/projects
      # Route chat to the `browser` gateway instead of running an in-process
      # agent. The lean image depends on this: api/gateway_chat.py imports only
      # stdlib plus WebUI-local modules, so the agent is never imported and its
      # source never needs to be present.
      - HERMES_WEBUI_CHAT_BACKEND=gateway
      - HERMES_WEBUI_GATEWAY_BASE_URL=http://hermes:${HERMES_BROWSER_API_PORT:-8644}
      - HERMES_WEBUI_GATEWAY_USE_RUNS_API=true
      # The first-run wizard decides "chat ready" by importing run_agent inside
      # this container. Lean/gateway mode never has that module, so without this
      # the wizard blocks every fresh browser with "Missing or partially
      # importable" even though the remote browser gateway is configured and
      # healthy. The skip is unconditional: it marks onboarding complete and
      # stops the wizard from rewriting config.yaml / .env.
      - HERMES_WEBUI_SKIP_ONBOARDING=1
      # Each cached agent pins a full transcript, which makes this the biggest
      # lever on resident memory. The default of 25 does not fit the limit below.
      - HERMES_WEBUI_AGENT_CACHE_MAX=5
      # Inject AGENTS.md from the selected WebUI workspace on each turn.
      # Gateway mode does not pass cwd, so native agent AGENTS.md loading never
      # fires for browser chat; this stock WebUI hook fills that gap. See
      # docs/projects.md.
      - HERMES_WEBUI_PREFILL_MESSAGES_SCRIPT=/bootstrap/project-brief-prefill.py
      - HERMES_WEBUI_PREFILL_CONTEXT_MAX_CHARS=${HERMES_WEBUI_PREFILL_CONTEXT_MAX_CHARS:-8000}
      # Align the container user with the mounts; the entrypoint chowns its own
      # home and the workspace dir, so a mismatch here rewrites ownership of
      # ASSISTANT_DATA_ROOT/projects out from under the hermes container.
      - WANTED_UID=${HERMES_UID:-1000}
      - WANTED_GID=${HERMES_GID:-1000}
    volumes:
      # Shared Hermes state; WebUI keeps its own state under /opt/data/webui.
      - ./data/hermes:/opt/data
      - ./compose/hermes/skills:/opt/skills:ro
      - ./compose/hermes/scripts/project-brief-prefill.py:/bootstrap/project-brief-prefill.py:ro
      - ./compose/hermes/scripts/hermeswebui-entrypoint.sh:/bootstrap/hermeswebui-entrypoint.sh:ro
      - ./compose/hermes/scripts/projects_library.py:/bootstrap/projects_library.py:ro
      - ./compose/hermes/scripts/patch-webui-projects-library.py:/bootstrap/patch-webui-projects-library.py:ro
      - ${ASSISTANT_DATA_ROOT:-./data}/projects:/opt/projects
      - ${ASSISTANT_DATA_ROOT:-./data}/voice:/opt/voice
      - ${ASSISTANT_DATA_ROOT:-./data}/memory:/opt/memory
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      hermes-browser-bootstrap:
        condition: service_completed_successfully
      hermes:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8787/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s

networks:
  # Internal: no route off the host. Members: postgres-db, db-provision,
  # sql-mcp-ro, sql-mcp-rw, hermes, and any integration that stores data.
  db:
    internal: true

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_storage:
  n8n_storage:
  opencode_config:
  opencode_data:
  valkey_data:
  gptr_outputs:
  ollama_data:
  hermes_uv_cache:

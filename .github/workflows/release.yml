name: release

# For each pushed v* tag (creating the GitHub release if needed):
#   - builds the SSH listener image (compose/ssh-listener) for linux/amd64 and
#     linux/arm64 and pushes it to GHCR, tagged with the version;
#   - attaches the tarball scripts/install.sh installs, with its .sha256;
#   - attaches ssh-listener.sh, with that image pinned by digest, and its
#     .sha256 (scripts/release-ssh-listener.sh).
# Run it by hand for an older tag with the tag input. A tag without
# compose/ssh-listener gets the tarball only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.3.17"
        required: true

permissions:
  contents: write

jobs:
  ssh-listener-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag has the listener
        id: has
        run: |
          if [ -f compose/ssh-listener/Dockerfile ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/ssh-listener" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: steps.has.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.has.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.has.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: push
        if: steps.has.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: compose/ssh-listener
          target: release
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.TAG }}
          tags: ${{ steps.has.outputs.image }}:${{ env.TAG }}
          push: true
      - name: Pinned reference
        id: ref
        if: steps.has.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.has.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "no digest from the push: $DIGEST" >&2; exit 1 ;; esac
          echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

  tarball:
    needs: ssh-listener-image
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      LISTENER_REF: ${{ needs.ssh-listener-image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the tarball
        run: scripts/release-tarball.sh "$TAG" dist
      - name: Write ssh-listener.sh
        if: env.LISTENER_REF != ''
        run: |
          # The tag's copy, not the checked-out branch's.
          git checkout "$TAG" -- scripts/ssh-listener.sh scripts/release-ssh-listener.sh
          scripts/release-ssh-listener.sh "$TAG" "$LISTENER_REF" dist
      - name: Attach them to the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)."
          fi

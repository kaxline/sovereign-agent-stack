use_default_settings: true

server:
  # Placeholder only. setup.sh copies this to settings.local.yml (gitignored)
  # and writes a real secret there. Compose mounts settings.local.yml.
  secret_key: "ultrasecretkey"
  limiter: false

search:
  formats:
    - html
    - json
  # Defaults are 1h–15d; agent traffic trips CAPTCHA/429 and then stays empty.
  # Shorter bans so working engines recover without a container restart.
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 180
    cf_SearxEngineCaptcha: 1800
    cf_SearxEngineAccessDenied: 600
    recaptcha_SearxEngineCaptcha: 1800

# Keep default general search lean. Each query fans out to every enabled
# engine from one IP; 6–8 parallel upstreams is what emptied results under
# agent load. Prefer two survivors over many magnets.
#
# Disabled (CAPTCHA / 429 / 403 magnets in practice):
#   duckduckgo, startpage, brave, yep, mojeek
# Enabled:
#   bing (independent fallback), google cse (stays via defaults; recovers
#   after short 429 windows)
engines:
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: brave
    disabled: true
  - name: yep
    disabled: true
  - name: mojeek
    disabled: true
  - name: bing
    disabled: false

# When running with: docker compose --profile searxng-prod up -d
# server:
#   limiter: true
# redis:
#   url: redis://valkey:6379/0
